services:
  mysql:
    image: mysql:8.4
    container_name: aurora-inventory-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: aurora_inventory
      MYSQL_USER: aurora
      MYSQL_PASSWORD: aurora123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3306:3306"
    volumes:
      - aurora_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  aurora_mysql_data:
